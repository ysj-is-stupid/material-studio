server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/material_studio?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:material_app}
    password: ${DB_PASSWORD:local_demo_password}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  storage-root: ${STORAGE_ROOT:./data}
  simulation:
    default-fail-stage: ${SIM_DEFAULT_FAIL_STAGE:NONE}
    default-step-delay-ms: ${SIM_DEFAULT_STEP_DELAY_MS:1500}
    allow-request-override: ${SIM_ALLOW_REQUEST_OVERRIDE:false}
